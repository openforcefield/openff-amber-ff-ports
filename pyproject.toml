[build-system]
requires = [
    "setuptools>=64",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "openff-amber-ff-ports"
dynamic = ["version"]
description = "openff-amber-ff-ports"
readme = "README.md"
license = { text = "CC-BY-4.0" }
authors = [
    { name = "The Open Force Field Initiative", email = "info@openforcefield.org" },
]
urls = { Homepage = "https://github.com/openforcefield/openff-amber-ff-ports" }

[project.entry-points."openforcefield.smirnoff_forcefield_directory"]
get_forcefield_dirs_paths = "openff.amber_ff_ports.amber_ff_ports:get_forcefield_dirs_paths"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["openff.*"]

[tool.setuptools.package-data]
"openff.amber_ff_ports" = ["offxml/*"]

[tool.setuptools_scm]


[tool.coverage.run]
omit = [
    "*/tests/*",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.lint.per-file-ignores]
"openff/amber_ff_ports/tests/test_amber_ff_ports.py" = ["F401"]
