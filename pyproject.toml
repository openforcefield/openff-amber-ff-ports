[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=64",
  "setuptools-scm>=8",
]

[project]
name = "openff-amber-ff-ports"
description = "openff-amber-ff-ports"
readme = "README.md"
license = { text = "CC-BY-4.0" }
authors = [
  { name = "The Open Force Field Initiative", email = "info@openforcefield.org" },
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
urls = { Homepage = "https://github.com/openforcefield/openff-amber-ff-ports" }
entry-points."openforcefield.smirnoff_forcefield_directory".get_forcefield_dirs_paths = """\
  openff.amber_ff_ports.amber_ff_ports:get_forcefield_dirs_paths\
  """

[tool.setuptools]
packages.find.include = [ "openff.*" ]
include-package-data = true
package-data."openff.amber_ff_ports" = [ "offxml/*" ]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 119
lint.extend-select = [ "E", "F", "I", "UP", "W" ]
lint.per-file-ignores."openff/amber_ff_ports/_tests/test_amber_ff_ports.py" = [ "F401" ]

[tool.coverage]
run.omit = [
  "*/_tests/*",
]
